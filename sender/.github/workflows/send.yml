name: Send reminders

on:
  schedule:
    # Every 15 minutes. GitHub may start scheduled runs a few minutes late at busy times.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# One run at a time, so a slow run and the next one never send the same slot twice.
concurrency:
  group: send-reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
